version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /.devcontainer
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        update-types: [minor, patch]
